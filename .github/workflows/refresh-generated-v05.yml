name: Refresh v0.5 generated assets
on:
  push:
    branches:
      - feat/cli-onboarding-v05
    paths:
      - .github/workflows/refresh-generated-v05.yml
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/cli-onboarding-v05
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install -e '.[analytics]'
          npm install --ignore-scripts --no-audit --no-fund
      - name: Rebuild canonical web artifacts
        run: |
          npm run build
          rm .github/workflows/refresh-generated-v05.yml
          python scripts/package_web.py
          python scripts/release_check.py
      - name: Commit generated v0.5 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "build: refresh v0.5 generated web assets"
          git push origin HEAD:feat/cli-onboarding-v05
