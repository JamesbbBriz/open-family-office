[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-family-office"
version = "0.5.0"
description = "Local-first family wealth research, agent skills and auditable quantitative tools"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
  "family-office",
  "wealth-management",
  "asset-allocation",
  "financial-planning",
  "ai-agents",
  "local-first",
  "fintech",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["plotly==6.5.2"]

[project.urls]
Homepage = "https://github.com/JamesbbBriz/open-family-office"
Repository = "https://github.com/JamesbbBriz/open-family-office"
Issues = "https://github.com/JamesbbBriz/open-family-office/issues"
Documentation = "https://github.com/JamesbbBriz/open-family-office/tree/main/docs"
Releases = "https://github.com/JamesbbBriz/open-family-office/releases"

[project.optional-dependencies]
analytics = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2"]
quant = ["skfolio>=0.9,<1", "PyPortfolioOpt>=1.5.6,<2"]
market = ["yfinance>=0.2.60,<1"]
documents = ["pypdf>=5.9,<7", "ofxparse==0.21"]
mcp = ["mcp>=1.10,<2"]
recommended = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "pypdf>=5.9,<7", "ofxparse==0.21", "mcp>=1.10,<2",
]
all = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "skfolio>=0.9,<1", "PyPortfolioOpt>=1.5.6,<2", "yfinance>=0.2.60,<1",
  "pypdf>=5.9,<7", "ofxparse==0.21", "mcp>=1.10,<2",
]

[project.scripts]
ofo = "open_family_office.cli:main"
open-family-office = "open_family_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_family_office*"]

[tool.open-family-office]
try = "uvx --from git+https://github.com/JamesbbBriz/open-family-office.git ofo demo"
install = "uv tool install git+https://github.com/JamesbbBriz/open-family-office.git"
notes = "The wheel bundles the synthetic demo, private-workspace templates, agent kit and offline web resources. Optional extras unlock quant, document, provider and MCP integrations."
