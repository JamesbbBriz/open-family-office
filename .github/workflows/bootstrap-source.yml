name: Bootstrap source
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"

concurrency:
  group: open-family-office-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble verified source tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap-min/part*.b64)
          if [ "${#parts[@]}" -ne 13 ]; then
            echo "Waiting for all 13 source chunks; currently have ${#parts[@]}."
            exit 0
          fi
          cat "${parts[@]}" > /tmp/open-family-office.b64
          base64 -d /tmp/open-family-office.b64 > /tmp/open-family-office.tar.gz
          echo "bbc5d935f01166b19df0c188f7f8cee1a29c74f42a8c2e1f23a8054a5293c866  /tmp/open-family-office.tar.gz" | sha256sum -c -
          tar -xzf /tmp/open-family-office.tar.gz -C .
          rm -rf .bootstrap .bootstrap-min
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "feat: publish Open Family Office source"
          git push origin HEAD:main
