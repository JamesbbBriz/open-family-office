name: Publish reviewed Open Family Office source

on:
  push:
    paths:
      - '.github/bootstrap/ready.json'

permissions:
  contents: write

concurrency:
  group: initial-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JamesbbBriz/open-family-office'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and unpack reviewed source
        run: |
          python - <<'PY'
          import hashlib, io, json, lzma, pathlib, shutil, tarfile
          root = pathlib.Path.cwd()
          seed = root / '.github/bootstrap'
          ready = json.loads((seed / 'ready.json').read_text())
          expected = 'dbd5ae26f23ba656914efd2bca1a47aa20fa23428d0e8e07060f0cdfa0f11093'
          assert ready['sha256'] == expected and ready['parts'] == 12
          raw = b''.join((seed / f'part-{i:03d}.bin').read_bytes() for i in range(12))
          assert len(raw) == 144352
          assert hashlib.sha256(raw).hexdigest() == expected, 'Source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw))) as archive:
              members = archive.getmembers()
              assert len(members) == 212
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute()
                  assert '..' not in path.parts and '.git' not in path.parts
                  assert path.parts[:2] != ('.github', 'workflows')
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          shutil.rmtree(seed)
          (root / 'public').mkdir(exist_ok=True)
          (root / 'assets/readme').mkdir(parents=True, exist_ok=True)
          print('Verified and unpacked 212 reviewed source files; temporary transport removed.')
          PY
      - name: Install report and screenshot dependencies
        run: |
          python -m pip install 'numpy>=2.1,<3' 'pandas>=2.2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'plotly==6.5.2' 'pypdf>=5.9,<7' playwright
          python -m playwright install --with-deps chromium
      - name: Build static website and actual UI screenshots
        run: |
          python scripts/build_site.py
          python scripts/capture_readme.py
      - name: Verify calculations and release hygiene
        run: |
          python -m unittest discover -s tests -v
          node tests/sandbox.test.cjs
          python scripts/hh.py demo
          python scripts/release_check.py
      - name: Apply repository discovery metadata when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          result = subprocess.run(['python', 'scripts/configure_github.py', '--apply'], capture_output=True, text=True)
          text = result.stdout + result.stderr
          print(text)
          Path('evals/github-metadata-publication.json').write_text(json.dumps({'applied': result.returncode == 0, 'exit_code': result.returncode, 'note': 'Repository description/topics attempted using the repository-scoped Actions token. Admin-level settings may require the owner.'}, indent=2) + '\n')
          PY
      - name: Package source download and manifest
        run: |
          python scripts/package_web.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from scripts.release_check import release_files
          root = Path.cwd()
          lines = []
          for path in release_files():
              rel = path.relative_to(root).as_posix()
              if rel == 'MANIFEST.sha256' or path.name == 'import-once.yml':
                  continue
              lines.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + rel + '\n')
          (root / 'MANIFEST.sha256').write_text(''.join(lines))
          PY
          python scripts/release_check.py
      - name: Publish verified source and screenshots without overwriting concurrent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add -A -- . ':!.github/workflows'
          git commit -m 'feat: publish Open Family Office v0.3 with bilingual README and real screenshots'
          git push origin HEAD:main
