name: Household scenario or feature
description: Describe a concrete modelling gap without personal data.
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: What fictional household situation is not represented correctly?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Expected result, assumptions and a testable acceptance condition
    validations:
      required: true
