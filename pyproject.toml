[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-family-office"
version = "0.3.0"
description = "Local-first household wealth research workflows, explicit data adapters and auditable quantitative tools"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
analytics = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "plotly==6.5.2"]
quant = ["skfolio>=0.9,<1", "PyPortfolioOpt>=1.5.6,<2"]
market = ["yfinance>=0.2.60,<1"]
documents = ["pypdf>=5.9,<7", "ofxparse==0.21"]
mcp = ["mcp>=1.10,<2"]
all = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "plotly==6.5.2", "skfolio>=0.9,<1", "PyPortfolioOpt>=1.5.6,<2", "yfinance>=0.2.60,<1", "pypdf>=5.9,<7", "ofxparse==0.21", "mcp>=1.10,<2"]

[project.scripts]
hh = "household_cio.cli:main"

[tool.setuptools.packages.find]
include = ["household_cio*"]

[tool.open-family-office]
run = "python scripts/hh.py demo"
notes = "Source checkout required for example/template/report assets. Editable installation supported; standalone wheel publication not claimed. OpenBB runs in an isolated environment."
