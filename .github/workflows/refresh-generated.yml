name: Refresh generated web
on:
  push:
    branches:
      - refactor/repository-architecture
    paths:
      - .refresh-web
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-architecture
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[analytics]'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python scripts/package_web.py
      - name: Commit canonical generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public web/src/tailwind.generated.css examples/dashboard-data.synthetic.json
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh canonical web artifacts"
          git push origin HEAD:refactor/repository-architecture
