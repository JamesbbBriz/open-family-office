name: Bug report with synthetic data
description: Report a reproducible workflow or calculation problem.
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains only fictional data and no credentials or private documents.
          required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal command and synthetic input
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, agent host and model versions (where relevant)
