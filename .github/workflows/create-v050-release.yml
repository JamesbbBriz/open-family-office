name: Create v0.5.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v050-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.0             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Open Family Office v0.5.0"             --notes-file docs/releases/v0.5.0.md
      - name: Remove one-time release workflow
        run: |
          rm .github/workflows/create-v050-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time v0.5.0 release workflow"
          git push origin HEAD:main
