name: Refresh v0.5 source kit
on:
  push:
    branches:
      - feat/cli-onboarding-v05
    paths:
      - .github/workflows/refresh-source-kit-v05.yml
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/cli-onboarding-v05
      - name: Rebuild source kit from final source tree
        run: |
          rm .github/workflows/refresh-source-kit-v05.yml
          python scripts/package_web.py
          python scripts/release_check.py
      - name: Commit refreshed source kit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "build: refresh final v0.5 source kit"
          git push origin HEAD:feat/cli-onboarding-v05
