name: Create v0.5.1 draft release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/create-v051-draft.yml"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Remove the one-time workflow first
        run: |
          rm .github/workflows/create-v051-draft.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time v0.5.1 draft workflow"
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create draft release on the clean target commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.1             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "Open Family Office v0.5.1"             --notes-file docs/releases/v0.5.1.md             --draft
