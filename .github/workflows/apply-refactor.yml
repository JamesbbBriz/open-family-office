name: Apply refactor bundle
on:
  push:
    branches:
      - refactor/repository-architecture
    paths:
      - .bootstrap/refactor/READY
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-architecture
          fetch-depth: 0
      - name: Verify and extract refactor bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/refactor/chunk-*.b64 > /tmp/ofo-refactor.b64
          base64 --decode /tmp/ofo-refactor.b64 > /tmp/ofo-refactor.tar.gz
          echo "12a90476cf74bca581952dcb4d17c6e12f1a286ab84014f1bdd2e6dfa4ef4ed4  /tmp/ofo-refactor.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ofo-refactor
          tar -xzf /tmp/ofo-refactor.tar.gz -C /tmp/ofo-refactor

          rm -rf \
            household_cio workflows methodology schemas templates site launch evals providers \
            src agent web public assets config scripts tests requirements vendor \
            .agents/skills .claude/skills .claude/commands
          rm -f MANIFEST.sha256 DELIVERY.md RELEASE-CHECKLIST.md scripts/hh.py

          cp -a /tmp/ofo-refactor/. .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-refactor.yml

          python scripts/package_web.py
          python scripts/ofo.py demo >/tmp/ofo-demo.txt
          python scripts/release_check.py
          node tests/sandbox.test.cjs
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify architecture and agent skill UX"
          git push origin HEAD:refactor/repository-architecture
