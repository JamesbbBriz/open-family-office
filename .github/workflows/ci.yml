name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e '.[analytics,documents]'

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic CLI demo
        if: matrix.python-version == '3.12'
        run: python scripts/ofo.py demo

      - name: Check release hygiene
        if: matrix.python-version == '3.12'
        run: python scripts/release_check.py

  wheel-smoke:
    name: Wheel smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: python -m pip wheel . --wheel-dir dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/ofo-wheel
          /tmp/ofo-wheel/bin/python -m pip install --upgrade pip
          /tmp/ofo-wheel/bin/python -m pip install dist/open_family_office-*.whl

      - name: Run installed CLI outside the source checkout
        working-directory: /tmp
        run: |
          /tmp/ofo-wheel/bin/ofo --version
          /tmp/ofo-wheel/bin/open-family-office --version
          /tmp/ofo-wheel/bin/ofo demo
          rm -rf /tmp/ofo-private
          /tmp/ofo-wheel/bin/ofo init /tmp/ofo-private
          cd /tmp/ofo-private
          /tmp/ofo-wheel/bin/ofo status
          /tmp/ofo-wheel/bin/ofo agent sync
          /tmp/ofo-wheel/bin/ofo mcp-config --format json > /tmp/mcp-config.json

      - name: Verify installed private dashboard flow
        working-directory: /tmp
        run: |
          /tmp/ofo-wheel/bin/python - <<'PY'
          from pathlib import Path
          import shutil
          from open_family_office.resources import resource_path
          shutil.copy2(
              resource_path("examples/household.synthetic.json"),
              Path("/tmp/ofo-private/household.json"),
          )
          PY
          cd /tmp/ofo-private
          /tmp/ofo-wheel/bin/ofo overview --format markdown > /tmp/overview.md
          /tmp/ofo-wheel/bin/ofo dashboard --out /tmp/ofo-private/reports/review.html
          test -s /tmp/ofo-private/reports/review.html
          test -s /tmp/ofo-private/.agents/skills/ofo-start/SKILL.md

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install Python web dependencies
        run: python -m pip install -e '.[analytics]'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run browser arithmetic tests
        run: node tests/sandbox.test.cjs

      - name: Rebuild static web
        run: npm run build

      - name: Verify generated web is committed
        run: git diff --exit-code -- public web/src/tailwind.generated.css

  optional-native:
    name: Optional native integrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - run: python -m pip install -e '.[all]'
      - run: python -m unittest discover -s tests -v
      - run: ofo doctor
